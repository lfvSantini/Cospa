<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cospa Logística - Login</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        html, body {
            height: 100% !important;
            margin: 0 !important;
            padding: 0 !important;
        }

        body {
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            min-height: 100vh !important;
            background-color: var(--bg-body, #f4f6f9) !important;
            position: relative;
        }

        .login-header-switch {
            position: fixed !important;
            top: 20px !important;
            right: 20px !important;
            z-index: 100;
        }

        .login-wrapper {
            display: flex !important;
            justify-content: center !important;
            align-items: center !important;
            width: 100% !important;
            max-width: 420px !important;
            padding: 20px !important;
            box-sizing: border-box !important;
            margin: auto !important;
        }

        .login-container {
            width: 100% !important;
            background: var(--bg-card, #ffffff) !important;
            border-radius: 12px !important;
            padding: 32px !important;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08) !important;
            display: flex !important;
            flex-direction: column !important;
            box-sizing: border-box !important;
        }

        .logo-area {
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            margin-bottom: 24px !important;
            text-align: center !important;
        }

        .logo-area img {
            max-width: 160px;
            max-height: 80px;
            object-fit: contain;
            margin-bottom: 12px;
        }

        .logo-area h2 {
            margin: 0 !important;
            font-size: 1.3rem !important;
            font-weight: 700 !important;
            color: var(--text-primary, #2c3e50) !important;
        }

        #loginForm {
            display: flex !important;
            flex-direction: column !important;
            gap: 16px !important;
            width: 100% !important;
        }

        .input-group {
            display: flex !important;
            flex-direction: column !important;
            gap: 6px !important;
            text-align: left !important;
        }

        .input-group label {
            font-size: 0.875rem !important;
            font-weight: 600 !important;
            color: var(--text-secondary, #4a5568) !important;
        }

        .input-group input {
            width: 100% !important;
            padding: 11px 14px !important;
            border: 1px solid var(--border-color, #cbd5e0) !important;
            border-radius: 6px !important;
            font-size: 0.95rem !important;
            background: var(--bg-input, #ffffff) !important;
            color: var(--text-primary, #2d3748) !important;
            box-sizing: border-box !important;
            outline: none !important;
        }

        .input-group input:focus {
            border-color: #0056b3 !important;
            box-shadow: 0 0 0 3px rgba(0, 86, 179, 0.15) !important;
        }

        #btnLogin {
            margin-top: 8px !important;
            padding: 12px !important;
            background-color: #0056b3 !important;
            color: #ffffff !important;
            border: none !important;
            border-radius: 6px !important;
            font-size: 1rem !important;
            font-weight: 600 !important;
            cursor: pointer !important;
            transition: background 0.2s !important;
            width: 100% !important;
        }

        #btnLogin:hover {
            background-color: #004085 !important;
        }

        .error-message {
            display: none;
            padding: 10px !important;
            border-radius: 6px !important;
            background-color: #fde8e8 !important;
            color: #9b1c1c !important;
            font-size: 0.85rem !important;
            text-align: center !important;
            border: 1px solid #f8b4b4 !important;
        }

        .error-message.ativo {
            display: block !important;
        }
    </style>
</head>
<body>
    <div class="login-header-switch">
        <label class="theme-switch" for="themeToggle">
            <input type="checkbox" id="themeToggle">
            <span class="slider">
                <svg class="icon sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg class="icon moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <span class="thumb"></span>
            </span>
        </label>
    </div>

    <div class="login-wrapper">
        <div class="login-container">
            <div class="logo-area">
                <img src="assets/img/logo.png" alt="Cospa Logística Logo" onerror="this.style.display='none'">
                <h2>Painel de Login</h2>
            </div>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="username">Usuário</label>
                    <input type="text" id="username" placeholder="Digite seu usuário..." required autocomplete="username">
                </div>
                
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" placeholder="Digite sua senha..." required autocomplete="current-password">
                </div>
                
                <div id="errorMessage" class="error-message"></div>
                
                <button type="submit" id="btnLogin">Entrar</button>
            </form>
        </div>
    </div>

    <script src="assets/js/login.js"></script>
</body>
</html>
