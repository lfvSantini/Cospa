# Configurações do Banco de Dados
spring.datasource.url=jdbc:mysql://localhost:3306/logistica_db?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Desativa a alteração automática pelo Hibernate em favor do Flyway
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Ativa o Flyway
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true